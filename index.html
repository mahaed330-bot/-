<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر الهواتف</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F7;--surface:#fff;--ink:#17212B;--muted:#586878;--line:#D5DDE4;--accent:#2457D6;--accent-ink:#fff;--tile:#E4EBF2;--ok:#1E7A4C;--sale:#C62F2F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161C;--surface:#18212A;--ink:#E8EEF3;--muted:#9AAAB8;--line:#2A3743;--accent:#6E96FF;--accent-ink:#0B1220;--tile:#213040;--ok:#5CCB92;--sale:#FF8A80}}
:root[data-theme="dark"]{--bg:#10161C;--surface:#18212A;--ink:#E8EEF3;--muted:#9AAAB8;--line:#2A3743;--accent:#6E96FF;--accent-ink:#0B1220;--tile:#213040;--ok:#5CCB92;--sale:#FF8A80}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:28px 0 12px}
h1{font-size:clamp(1.7rem,5vw,2.6rem);margin:0 0 6px;font-weight:700;line-height:1.3}
header p{margin:0;color:var(--muted);max-width:52ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
input{flex:1 1 220px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px}
.chip{flex:none;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:start;font:inherit;color:inherit;padding:0;cursor:pointer}
.card:hover{border-color:var(--accent)}
.pic{background:var(--tile);height:150px;display:grid;place-items:center;font-size:3.6rem}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{color:var(--muted);font-size:.85rem}
.name{font-weight:700;font-size:1.05rem}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:1.15rem}
.rate{color:var(--muted);font-size:.9rem}
.pic,.d-pic{position:relative}.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--sale);color:var(--accent-ink);font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:6px}.old{color:var(--muted);font-weight:400;font-size:.9rem}.rolebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:12px}
#staff{display:grid;gap:14px;margin:6px 0 22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h2{margin:0 0 10px;font-size:1.15rem}
.stats{display:flex;gap:24px;margin-bottom:12px}.stats div{display:flex;flex-direction:column}.stats b{font-size:1.4rem}.stats span{color:var(--muted);font-size:.85rem}
.frm{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.frm input[type=number]{width:90px;flex:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
td input[type=number]{width:70px}.msg{margin:4px 0;color:var(--ok);min-height:1.4em}
.frm input{flex:1 1 140px}.sub{font-size:1rem;margin:16px 0 0}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.d-pic{background:var(--tile);height:170px;display:grid;place-items:center;font-size:4.5rem}
.d-body{padding:16px 18px 18px}
.d-body h2{margin:0 0 4px;font-size:1.3rem}
.specs{list-style:none;padding:0;margin:12px 0;border-top:1px solid var(--line)}
.specs li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.specs span:first-child{color:var(--muted)}
.stock{color:var(--ok);font-weight:500}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{font:inherit;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="rolebar"><span id="who"></span><select id="role" hidden><option value="v">زائر</option><option value="s">مبيعات</option><option value="m">مودون</option><option value="a">مدير</option></select><span><button class="btn" id="login">دخول الموظفين</button> <button class="btn" id="logout" hidden>خروج</button></span></div>
<h1>متجر الهواتف</h1>
<p>اختر هاتفك حسب الماركة والسعر، وقارن الشاشة والتخزين والكاميرا والبطارية قبل الشراء.</p>
<div class="tools">
<input id="q" type="search" placeholder="ابحث عن هاتف" aria-label="ابحث عن هاتف">
<select id="sort" aria-label="الترتيب">
<option value="def">الترتيب الافتراضي</option>
<option value="lo">السعر: الأقل أولاً</option>
<option value="hi">السعر: الأعلى أولاً</option>
<option value="rt">الأعلى تقييماً</option>
</select>
</div>
<div class="chips" id="chips" role="group" aria-label="الماركات"></div>
</header>
<section id="staff" hidden aria-label="لوحة الموظفين"></section>
<main>
<p class="count" id="count" aria-live="polite"></p>
<div class="grid" id="grid"></div>
</main>
<footer>جميع الحقوق محفوظة.</footer>
</div>

<dialog id="dlg" aria-labelledby="d-name">
<div class="d-pic" id="d-pic" aria-hidden="true"></div>
<div class="d-body">
<h2 id="d-name"></h2>
<div class="cat" id="d-cat"></div>
<ul class="specs" id="d-specs"></ul>
<div class="row"><span class="price" id="d-price"></span><span class="stock" id="d-stock"></span></div>
<div class="btns"><button class="btn main" id="d-add">اطلب عبر واتساب</button><button class="btn" id="d-close">إغلاق</button></div>
</div>
</dialog>

<dialog id="ad" aria-label="دخول"><div class="d-body"><h2>دخول الموظفين</h2><div class="frm"><input id="em" type="email" placeholder="البريد الإلكتروني" aria-label="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور" aria-label="كلمة المرور"></div><p class="msg" id="am" role="status"></p><div class="btns"><button class="btn main" id="ain">دخول</button><button class="btn" id="aup">إنشاء حساب</button><button class="btn" id="acl">إغلاق</button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
var CUR=CFG.CUR||"$";
var P=[];function fp(x){return Math.round(x.p*(100-x.d)/100)}
var cat="الكل",chips=document.getElementById("chips"),grid=document.getElementById("grid");
var cats=["الكل","عروض"].concat(P.map(function(x){return x.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
cats.forEach(function(c){var b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cat);b.onclick=function(){cat=c;[].forEach.call(chips.children,function(k){k.setAttribute("aria-pressed",k===b)});render()};chips.appendChild(b)});
function money(v){return v.toLocaleString("ar-EG")+" "+CUR}
function render(){
var q=document.getElementById("q").value.trim(),s=document.getElementById("sort").value;
var L=P.filter(function(x){return (cat==="الكل"||(cat==="عروض"?x.d>0:x.c===cat))&&x.n.indexOf(q)>-1});
if(s==="lo")L.sort(function(a,b){return fp(a)-fp(b)});
if(s==="hi")L.sort(function(a,b){return fp(b)-fp(a)});
if(s==="rt")L.sort(function(a,b){return b.r-a.r});
document.getElementById("count").textContent=L.length+" هاتف";
grid.innerHTML="";
if(!L.length){grid.innerHTML='<div class="empty">لا توجد نتائج. جرّب كلمة أخرى أو اختر ماركة مختلفة.</div>';return}
L.forEach(function(x){
var b=document.createElement("button");b.className="card";
b.innerHTML='<div class="pic" aria-hidden="true">'+x.e+(x.d?'<span class="badge">خصم '+x.d+'%</span>':'')+'</div><div class="body"><span class="cat">'+x.c+'</span><span class="name">'+x.n+'</span><div class="row"><span class="price">'+money(fp(x))+(x.d?' <s class="old">'+money(x.p)+'</s>':'')+'</span>'+(x.r?'<span class="rate">★ '+x.r.toLocaleString("ar-EG")+'</span>':'<span class="rate">جديد</span>')+'</div></div>';
b.onclick=function(){open_(x)};grid.appendChild(b)})}
var dlg=document.getElementById("dlg");
function open_(x){
document.getElementById("d-pic").innerHTML=x.e+(x.d?'<span class="badge">خصم '+x.d+'%</span>':"");
document.getElementById("d-name").textContent=x.n;
document.getElementById("d-cat").textContent=x.c;
document.getElementById("d-specs").innerHTML=x.s.map(function(r){return "<li><span>"+r[0]+"</span><span>"+r[1]+"</span></li>"}).join("");
document.getElementById("d-price").innerHTML=money(fp(x))+(x.d?" <s class=\"old\">"+money(x.p)+"</s>":"");
var st=document.getElementById("d-stock");st.textContent=x.t?"متوفر":"نفدت الكمية";st.style.color=x.t?"":"var(--muted)";
var a=document.getElementById("d-add");a.disabled=!x.t;a.hidden=!CFG.WHATSAPP;a.textContent="اطلب عبر واتساب";
a.onclick=function(){window.open("https://wa.me/"+CFG.WHATSAPP+"?text="+encodeURIComponent("أريد طلب: "+x.n),"_blank")};
dlg.showModal()}
document.getElementById("d-close").onclick=function(){dlg.close()};
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
document.getElementById("q").oninput=render;
document.getElementById("sort").onchange=render;
var S=[],ST=[];
var roleEl=document.getElementById("role"),staff=document.getElementById("staff"),msg="",sel=0;
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function opts(){return P.map(function(x,i){return '<option value="'+i+'"'+(i===sel?" selected":"")+'>'+esc(x.n)+'</option>'}).join("")}
function salesH(){
var tot=0,qty=0;S.forEach(function(x){tot+=x.v;qty+=x.q});
return '<div class="panel"><h2>المبيعات</h2><div class="stats"><div><b>'+money(tot)+'</b><span>إجمالي المبيعات</span></div><div><b>'+qty.toLocaleString("ar-EG")+'</b><span>عدد الهواتف المباعة</span></div></div>'
+'<div class="frm"><select id="sp" aria-label="الهاتف">'+opts()+'</select><input id="sq" type="number" min="1" value="1" aria-label="الكمية"><button class="btn main" data-act="sell">سجّل البيع</button></div><p class="msg" role="status">'+esc(msg)+'</p>'
+'<div class="tw"><table><tr><th>الهاتف</th><th>الكمية</th><th>المبلغ</th></tr>'+S.slice().reverse().map(function(x){return '<tr><td>'+esc(x.n)+'</td><td>'+x.q+'</td><td>'+money(x.v)+'</td></tr>'}).join("")+'</table></div></div>'}
function modH(){return '<div class="panel"><h2>إدارة المنتجات</h2><div class="tw"><table><tr><th>الهاتف</th><th>التوفر</th><th>الخصم %</th>'+(roleEl.value==="a"?'<th></th>':'')+'</tr>'+P.map(function(x,i){return '<tr><td>'+esc(x.n)+'</td><td><button class="btn" data-act="stock" data-i="'+i+'">'+(x.t?"متوفر":"نفدت الكمية")+'</button></td><td><input type="number" min="0" max="60" value="'+x.d+'" data-act="disc" data-i="'+i+'" aria-label="خصم '+esc(x.n)+'"></td>'+(roleEl.value==="a"?'<td><button class="btn" data-act="delp" data-i="'+i+'">'+(delAsk===i?"تأكيد الحذف":"حذف")+'</button></td>':'')+'</tr>'}).join("")+'</table></div>'+(roleEl.value==="a"?addForm():"")+'</div>'}
function mgrH(){var L={customer:"زبون",sales:"مبيعات",moderator:"مودون",manager:"مدير"};return '<div class="panel"><h2>الفريق والصلاحيات</h2><div class="tw"><table><tr><th>الحساب</th><th>الدور</th></tr>'+ST.map(function(x){return '<tr><td>'+esc(x.email)+'</td><td><select data-act="role" data-id="'+x.id+'" aria-label="دور '+esc(x.email)+'">'+Object.keys(L).map(function(k){return '<option value="'+k+'"'+(x.role===k?" selected":"")+'>'+L[k]+'</option>'}).join("")+'</select></td></tr>'}).join("")+'</table></div></div>'}
function renderStaff(){var r=roleEl.value;staff.hidden=r==="v";if(r==="v"){staff.innerHTML="";return}
staff.innerHTML=(r==="s"||r==="a"?salesH():"")+(r==="m"||r==="a"?modH():"")+(r==="a"?mgrH():"")}
roleEl.onchange=function(){msg="";msg2="";delAsk=-1;renderStaff()};
staff.addEventListener("click",function(e){var b=e.target.closest("button[data-act]");if(!b)return;var a=b.dataset.act,i=+b.dataset.i;
if(a==="sell"){sel=+document.getElementById("sp").value;var p=P[sel],q=Math.max(1,parseInt(document.getElementById("sq").value)||1);
if(!p.t){msg="هذا الهاتف نفدت كميته. غيّر توفره من إدارة المنتجات."}else{sb.from("sales").insert({product_id:p.id,product_name:p.n,qty:q,total:fp(p)*q}).then(function(r){msg=r.error?"تعذر التسجيل: "+r.error.message:"تم تسجيل البيع.";loadAll()})}renderStaff()}
if(a==="stock"){sb.from("products").update({stock:!P[i].t}).eq("id",P[i].id).then(loadAll)}
if(a==="delp"&&roleEl.value==="a"){if(delAsk===i){var pid=P[i].id;delAsk=-1;sel=0;sb.from("products").delete().eq("id",pid).then(loadAll)}else{delAsk=i;renderStaff()}}
if(a==="addp"&&roleEl.value==="a"){var g=function(k){return document.getElementById(k).value.replace(/[<>&"]/g,"").trim()};var n=g("pn"),br=g("pb"),pr=parseFloat(g("pp"));
if(!n||!br||!(pr>0)){msg2="اكتب الاسم والماركة والسعر على الأقل."}else{sb.from("products").insert({name:n,brand:br,price:pr,specs:[["الشاشة",g("ps")||"—"],["التخزين",g("pt")||"—"],["الكاميرا",g("pc")||"—"],["البطارية",g("pbt")||"—"]]}).then(function(r){msg2=r.error?"تعذرت الإضافة: "+r.error.message:"تمت إضافة "+n+".";loadAll()})}renderStaff();render()}
});
staff.addEventListener("change",function(e){var t=e.target;if(t.id==="sp")sel=+t.value;if(t.dataset.act==="disc"){var pi=+t.dataset.i;sb.from("products").update({discount:Math.min(60,Math.max(0,parseInt(t.value)||0))}).eq("id",P[pi].id).then(loadAll)}if(t.dataset.act==="role"){sb.from("profiles").update({role:t.value}).eq("id",t.dataset.id).then(loadAll)}});
var msg2="",delAsk=-1;
function buildChips(){
cats=["الكل","عروض"].concat(P.map(function(x){return x.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
if(cats.indexOf(cat)<0)cat="الكل";
chips.innerHTML="";
cats.forEach(function(c){var b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cat);b.onclick=function(){cat=c;[].forEach.call(chips.children,function(k){k.setAttribute("aria-pressed",k===b)});render()};chips.appendChild(b)})}
function addForm(){return '<h3 class="sub">إضافة هاتف جديد</h3><div class="frm"><input id="pn" placeholder="اسم الهاتف" aria-label="اسم الهاتف"><input id="pb" placeholder="الماركة" aria-label="الماركة" list="brands"><datalist id="brands">'+cats.slice(2).map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist><input id="pp" type="number" min="1" placeholder="السعر" aria-label="السعر"><input id="ps" placeholder="الشاشة" aria-label="الشاشة"><input id="pt" placeholder="التخزين" aria-label="التخزين"><input id="pc" placeholder="الكاميرا" aria-label="الكاميرا"><input id="pbt" placeholder="البطارية" aria-label="البطارية"><button class="btn main" data-act="addp">أضف المنتج</button></div><p class="msg" role="status">'+esc(msg2)+'</p>'}
var sb=window.supabase.createClient(CFG.URL,CFG.KEY),RM={customer:"v",sales:"s",moderator:"m",manager:"a"},RL={customer:"زبون",sales:"مبيعات",moderator:"مودون",manager:"مدير"};
async function loadAll(){
var pr=await sb.from("products").select("*").order("id");
P=(pr.data||[]).map(function(r){return{id:r.id,n:r.name,c:r.brand,p:Number(r.price),r:Number(r.rating),e:"📱",s:r.specs||[],t:r.stock?1:0,d:r.discount}});
var role=roleEl.value;S=[];ST=[];
if(role==="s"||role==="a"){var sr=await sb.from("sales").select("*").order("id");S=(sr.data||[]).map(function(x){return{n:x.product_name,q:x.qty,v:Number(x.total)}})}
if(role==="a"){var tr=await sb.from("profiles").select("*").order("email").limit(200);ST=tr.data||[]}
buildChips();renderStaff();render()}
async function applySession(){
var r=await sb.auth.getSession(),u=r.data.session&&r.data.session.user,role="customer";
if(u){var pf=await sb.from("profiles").select("role").eq("id",u.id).single();if(pf.data)role=pf.data.role}
roleEl.value=RM[role]||"v";
document.getElementById("who").textContent=u?u.email+" ("+RL[role]+")":"";
document.getElementById("login").hidden=!!u;document.getElementById("logout").hidden=!u;
await loadAll()}
sb.auth.onAuthStateChange(function(){setTimeout(applySession,0)});
var ad=document.getElementById("ad"),am=document.getElementById("am");
function cred(){return{email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value}}
document.getElementById("login").onclick=function(){ad.showModal()};
document.getElementById("acl").onclick=function(){ad.close()};
document.getElementById("logout").onclick=function(){sb.auth.signOut()};
document.getElementById("ain").onclick=function(){sb.auth.signInWithPassword(cred()).then(function(r){if(r.error)am.textContent="تعذر الدخول: "+r.error.message;else{am.textContent="";ad.close()}})};
document.getElementById("aup").onclick=function(){sb.auth.signUp(cred()).then(function(r){am.textContent=r.error?"تعذر إنشاء الحساب: "+r.error.message:"تم إنشاء الحساب. إن وصلتك رسالة تأكيد افتحها ثم سجّل الدخول."})};
render();
</script>
</body>
</html>
